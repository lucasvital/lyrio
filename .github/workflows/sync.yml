name: Data Sync

# Triggers the Lyrio sync endpoints on a schedule, independent of Vercel Cron.
# Only APP_URL is required. CRON_SECRET is optional:
#   - if the app has CRON_SECRET set, also set the same secret here;
#   - if not, the endpoints are open and APP_URL alone is enough.
# Configure in Settings → Secrets and variables → Actions:
#   - Variable: APP_URL       (e.g. https://your-app.vercel.app)
#   - Secret:   CRON_SECRET   (optional)

on:
  schedule:
    - cron: "0 * * * *" # hourly (UTC)
  workflow_dispatch: {}

concurrency:
  group: data-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      APP_URL: ${{ vars.APP_URL }}
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
    steps:
      - name: Check configuration
        id: cfg
        run: |
          if [ -z "$APP_URL" ]; then
            echo "::warning::APP_URL variable is not set — skipping sync. Set it in Settings → Secrets and variables → Actions → Variables."
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Run sync
        if: steps.cfg.outputs.configured == 'true'
        run: |
          base="${APP_URL%/}"
          args=(-sS --fail-with-body -X POST)
          if [ -n "$CRON_SECRET" ]; then
            args+=(-H "Authorization: Bearer ${CRON_SECRET}")
          fi

          # Call an endpoint repeatedly until it reports `done: true` (each call
          # processes a time-bounded batch and resumes via cursor). Bounded so a
          # stuck sync can't loop forever.
          run_until_done() {
            local name="$1" url="$2"
            echo "→ ${name}"
            for i in $(seq 1 60); do
              resp="$(curl "${args[@]}" "$url")" || { echo "  call failed"; return 1; }
              status="$(echo "$resp" | jq -r '.status // "ok"')"
              ingested="$(echo "$resp" | jq -r '.ingested // 0')"
              done="$(echo "$resp" | jq -r '.done // true')"
              echo "  batch ${i}: status=${status} ingested=${ingested} done=${done}"
              if [ "$status" = "error" ]; then
                echo "  error: $(echo "$resp" | jq -r '.message // ""')"; return 1
              fi
              [ "$done" = "true" ] && { echo "  ${name} complete"; return 0; }
              sleep 2
            done
            echo "  ${name}: reached batch cap, will continue next run"
          }

          run_until_done "PostHog" "${base}/api/sync/posthog"
          run_until_done "RevenueCat" "${base}/api/sync/revenuecat"
          run_until_done "Attribution" "${base}/api/sync/attribution"
