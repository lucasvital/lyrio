name: Data Sync

# Triggers the Lyrio sync endpoints on a schedule, independent of Vercel Cron
# (works on any Vercel plan). The endpoints are protected by CRON_SECRET.
# Configure in the repo (Settings → Secrets and variables → Actions):
#   - Secret:   CRON_SECRET   (same value as the app's CRON_SECRET env)
#   - Variable: APP_URL       (e.g. https://your-app.vercel.app)

on:
  schedule:
    - cron: "0 * * * *" # hourly (UTC)
  workflow_dispatch: {} # manual run from the Actions tab

concurrency:
  group: data-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      APP_URL: ${{ vars.APP_URL }}
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
    steps:
      - name: Check configuration
        id: cfg
        run: |
          if [ -z "$APP_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "::warning::APP_URL variable and/or CRON_SECRET secret are not set — skipping sync."
            echo "Configure them in Settings → Secrets and variables → Actions."
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Sync PostHog
        if: steps.cfg.outputs.configured == 'true'
        run: |
          base="${APP_URL%/}"
          curl --fail-with-body -sS -X POST \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            "${base}/api/sync/posthog"
          echo

      - name: Sync RevenueCat
        if: steps.cfg.outputs.configured == 'true'
        run: |
          base="${APP_URL%/}"
          curl --fail-with-body -sS -X POST \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            "${base}/api/sync/revenuecat"
          echo
